# CD: al subir una etiqueta «v…» (por ejemplo v1.0.0) vuelve a verificar la app,
# compila el APK de release y lo publica en un Release de GitHub. A mano
# (Actions → «Release APK» → «Run workflow») solo deja el APK como artefacto.
#
# La dirección del backend se cambia sin tocar este archivo con la variable
# API_BASE_URL (Settings → Secrets and variables → Actions → Variables). Por
# defecto, la del emulador Android: http://10.0.2.2:8000.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar las dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar las pruebas
        run: flutter test

      - name: Compilar el APK de release
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: reservas-utpl-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar el Release con el APK (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
